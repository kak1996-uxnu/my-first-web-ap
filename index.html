<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>けいちゃん</title>
    <style>
        body {
            background-color: #FFFDD0; /* クリーム色 */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center; /* タイトルを中央に */
            color: skyblue; /* 水色 */
        }

        ul {
            max-width: 400px;
            margin: 30px auto;
            font-size: 18px;
        }

        body {
    background-color: #FFFDD0;
}

h1 {
    text-align: center;
    color: skyblue;
}

/* 点滅用 */
.blink {
    .blink {
    animation: blink 8s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
}
</style>
</head>
<body>

<h1 class="blink">けいちゃんのホームページ</h1>



    </style>
</head>
<body>



   <div class="item" onclick="toggle('profile')">
    👤 自己紹介
    <div id="profile" class="content">
        今、おうちでHPを作ってみたよよよん
    </div>
</div>

<div class="item" onclick="toggle('hobby')">
    🎮 趣味
    <div id="hobby" class="content">
        スンスンをみること
    </div>
</div>

<div class="item" onclick="toggle('food')">
    🍜 好きな食べ物
    <div id="food" class="content">
        高いお肉
    </div>
</div>

<script>
function toggle(id) {
    const element = document.getElementById(id);

    if (element.style.display === "block") {
        element.style.display = "none";
    } else {
        element.style.display = "block";
    }
}
</script>
<button class="btn">クリックするとオレンジ色なるよ！</button>

<style>
.btn {
    background-color: skyblue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.btn:hover {
    background-color: orange;
}
</style>
</body>
</html>
